          in: query
          schema:
            type: string
      responses:
        '200':
          description: Team report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamReportResponse'

  /reports/organisation:
    get:
      tags: [Reports]
      summary: Get organisation report
