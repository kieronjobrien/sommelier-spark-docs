openapi: 3.0.3
info:
  title: Sommelier Spark API
  description: |
    REST API for the Sommelier Spark wine training platform.

    ## Authentication
    All endpoints (except auth endpoints) require a Bearer JWT token.

    ## Rate Limiting
    - Standard: 100 requests/minute per user
    - Enterprise: 1000 requests/minute per user

    ## Versioning
    API version is specified in the URL path (`/api/v1/`).
  version: 1.0.0
  contact:
    name: Sommelier Spark API Support
    email: api-support@sommelierspark.com
  license:
    name: Proprietary
    url: https://sommelierspark.com/terms

servers:
  - url: https://api.sommelierspark.com/api/v1
    description: Production
  - url: https://api-staging.sommelierspark.com/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Development

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Organisations
    description: Organisation management
  - name: Wines
    description: Wine content management
  - name: Modules
    description: Learning module management
  - name: Quizzes
    description: Quiz management and attempts
  - name: Scenarios
    description: Interactive scenario management
  - name: Progress
    description: User progress tracking
  - name: Imports
    description: Bulk data import operations
  - name: Reports
    description: Analytics and reporting
  - name: Curriculum
    description: Curriculum generation

security:
  - bearerAuth: []

paths:
  # ============ Authentication ============
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate with email and password to receive access and refresh tokens.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecurePassword123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountLocked'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Invalidate current session and blacklist tokens.
      operationId: logout
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/InvalidToken'

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: Send password reset email to user.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: Reset password using token from email.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============ Users ============
  /users:
    get:
      tags: [Users]
      summary: List users
      description: List all users in the organisation.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create user
      description: Create a new user in the organisation.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user
      description: Get the authenticated user's profile.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/invite:
    post:
      tags: [Users]
      summary: Invite user
      description: Send invitation email to a new user.
      operationId: inviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Get a specific user's details.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update user
      description: Update user details.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      summary: Delete user
      description: Remove user from organisation.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '204':
          description: User deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/activate:
    post:
      tags: [Users]
      summary: Activate user
      description: Activate an invited user account.
      operationId: activateUser
      security: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateUserRequest'
      responses:
        '200':
          description: User activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{userId}/suspend:
    post:
      tags: [Users]
      summary: Suspend user
      description: Suspend a user account.
      operationId: suspendUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate user
      description: Reactivate a suspended user account.
      operationId: reactivateUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============ Organisations ============
  /organisations/current:
    get:
      tags: [Organisations]
      summary: Get current organisation
      description: Get the authenticated user's organisation.
      operationId: getCurrentOrganisation
      responses:
        '200':
          description: Organisation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationResponse'

    put:
      tags: [Organisations]
      summary: Update organisation
      description: Update organisation details.
      operationId: updateOrganisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganisationRequest'
      responses:
        '200':
          description: Organisation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organisations/current/settings:
    put:
      tags: [Organisations]
      summary: Update organisation settings
      description: Update organisation settings.
      operationId: updateOrganisationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationSettings'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganisationSettings'

  /organisations/current/branding:
    put:
      tags: [Organisations]
      summary: Update organisation branding
      description: Update organisation branding (logo, colors).
      operationId: updateOrganisationBranding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
                primaryColor:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
                secondaryColor:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
      responses:
        '200':
          description: Branding updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Branding'
        '403':
          $ref: '#/components/responses/FeatureNotAvailable'

  # ============ Wines ============
  /wines:
    get:
      tags: [Wines]
      summary: List wines
      description: List wines in the organisation.
      operationId: listWines
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: wineType
          in: query
          schema:
            $ref: '#/components/schemas/WineType'
        - name: region
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: priceTier
          in: query
          schema:
            $ref: '#/components/schemas/PriceTier'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of wines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineListResponse'

    post:
      tags: [Wines]
      summary: Create wine
      description: Create a new wine entry.
      operationId: createWine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWineRequest'
            example:
              name: Cloudy Bay Sauvignon Blanc 2024
              producer: Cloudy Bay
              vintage: 2024
              region: Marlborough
              country: NZ
              wineType: white
              grapeVarieties: [Sauvignon Blanc]
              priceTier: premium
              price: 28.00
      responses:
        '201':
          description: Wine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /wines/{wineId}:
    get:
      tags: [Wines]
      summary: Get wine by ID
      description: Get a specific wine's details.
      operationId: getWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      responses:
        '200':
          description: Wine details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Wines]
      summary: Update wine
      description: Update wine details.
      operationId: updateWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWineRequest'
      responses:
        '200':
          description: Wine updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Wines]
      summary: Delete wine
      description: Soft delete a wine.
      operationId: deleteWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      responses:
        '204':
          description: Wine deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /wines/{wineId}/submit:
    post:
      tags: [Wines]
      summary: Submit wine for review
      description: Submit a draft wine for review.
      operationId: submitWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      responses:
        '200':
          description: Wine submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /wines/{wineId}/approve:
    post:
      tags: [Wines]
      summary: Approve wine
      description: Approve a wine under review.
      operationId: approveWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback:
                  type: string
      responses:
        '200':
          description: Wine approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'

  /wines/{wineId}/reject:
    post:
      tags: [Wines]
      summary: Reject wine
      description: Reject a wine and return to draft.
      operationId: rejectWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
      responses:
        '200':
          description: Wine rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'

  /wines/{wineId}/publish:
    post:
      tags: [Wines]
      summary: Publish wine
      description: Publish an approved wine.
      operationId: publishWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      responses:
        '200':
          description: Wine published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'

  /wines/{wineId}/archive:
    post:
      tags: [Wines]
      summary: Archive wine
      description: Archive a published wine.
      operationId: archiveWine
      parameters:
        - $ref: '#/components/parameters/WineIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Wine archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WineResponse'

  # ============ Modules ============
  /modules:
    get:
      tags: [Modules]
      summary: List modules
      description: List learning modules.
      operationId: listModules
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: tier
          in: query
          schema:
            $ref: '#/components/schemas/Tier'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'

    post:
      tags: [Modules]
      summary: Create module
      description: Create a new learning module.
      operationId: createModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleRequest'
      responses:
        '201':
          description: Module created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'

  /modules/{moduleId}:
    get:
      tags: [Modules]
      summary: Get module by ID
      description: Get a specific module with lessons.
      operationId: getModule
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
      responses:
        '200':
          description: Module details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Modules]
      summary: Update module
      description: Update module details.
      operationId: updateModule
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModuleRequest'
      responses:
        '200':
          description: Module updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'

    delete:
      tags: [Modules]
      summary: Delete module
      description: Delete a module.
      operationId: deleteModule
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
      responses:
        '204':
          description: Module deleted

  /modules/{moduleId}/lessons:
    get:
      tags: [Modules]
      summary: List module lessons
      description: List lessons in a module.
      operationId: listModuleLessons
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
      responses:
        '200':
          description: List of lessons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'

    post:
      tags: [Modules]
      summary: Create lesson
      description: Add a lesson to a module.
      operationId: createLesson
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'

  /modules/{moduleId}/lessons/{lessonId}:
    put:
      tags: [Modules]
      summary: Update lesson
      description: Update lesson content.
      operationId: updateLesson
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
        - $ref: '#/components/parameters/LessonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'

    delete:
      tags: [Modules]
      summary: Delete lesson
      description: Delete a lesson from a module.
      operationId: deleteLesson
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '204':
          description: Lesson deleted

  /modules/{moduleId}/lessons/reorder:
    put:
      tags: [Modules]
      summary: Reorder lessons
      description: Reorder lessons within a module.
      operationId: reorderLessons
      parameters:
        - $ref: '#/components/parameters/ModuleIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonOrder]
              properties:
                lessonOrder:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Lessons reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'

  # ============ Quizzes ============
  /quizzes:
    get:
      tags: [Quizzes]
      summary: List quizzes
      description: List available quizzes.
      operationId: listQuizzes
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: tier
          in: query
          schema:
            $ref: '#/components/schemas/Tier'
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
      responses:
        '200':
          description: List of quizzes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizListResponse'

    post:
      tags: [Quizzes]
      summary: Create quiz
      description: Create a new quiz.
      operationId: createQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
      responses:
        '201':
          description: Quiz created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'

  /quizzes/{quizId}:
    get:
      tags: [Quizzes]
      summary: Get quiz by ID
      description: Get quiz details.
      operationId: getQuiz
      parameters:
        - $ref: '#/components/parameters/QuizIdParam'
      responses:
        '200':
          description: Quiz details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Quizzes]
      summary: Update quiz
      description: Update quiz details.
      operationId: updateQuiz
      parameters:
        - $ref: '#/components/parameters/QuizIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuizRequest'
      responses:
        '200':
          description: Quiz updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'

    delete:
      tags: [Quizzes]
      summary: Delete quiz
      description: Delete a quiz.
      operationId: deleteQuiz
      parameters:
        - $ref: '#/components/parameters/QuizIdParam'
      responses:
        '204':
          description: Quiz deleted

  /quizzes/{quizId}/preview:
    get:
      tags: [Quizzes]
      summary: Preview quiz
      description: Preview quiz with answers (for authors).
      operationId: previewQuiz
      parameters:
        - $ref: '#/components/parameters/QuizIdParam'
      responses:
        '200':
          description: Quiz preview with answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizPreviewResponse'

  /quizzes/{quizId}/questions:
    post:
      tags: [Quizzes]
