  /curriculum:
    get:
      tags: [Curriculum]
      summary: Get curriculum
      description: Get current curriculum structure.
      operationId: getCurriculum
      responses:
        '200':
          description: Curriculum structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number

    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Items per page

    SortParam:
      name: sort
      in: query
      schema:
        type: string
      description: 'Sort field and direction (e.g., name:asc)'
      example: createdAt:desc

    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User ID

    WineIdParam:
      name: wineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Wine ID

    ModuleIdParam:
      name: moduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Module ID

    LessonIdParam:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Lesson ID

    QuizIdParam:
      name: quizId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Quiz ID

    QuestionIdParam:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Question ID

    ScenarioIdParam:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Scenario ID

    AttemptIdParam:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Attempt ID

    ImportIdParam:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Import ID

    StartDateParam:
      name: startDate
      in: query
      schema:
        type: string
        format: date
      description: Report start date

    EndDateParam:
      name: endDate
      in: query
      schema:
        type: string
        format: date
      description: Report end date

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InvalidCredentials:
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InvalidToken:
      description: Invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    AccountLocked:
      description: Account is locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    FeatureNotAvailable:
      description: Feature not available on subscription tier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ============ Enums ============
    UserRole:
      type: string
      enum: [LEARNER, MANAGER, ADMIN, OWNER, SYSTEM_ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, INVITED, SUSPENDED, DEACTIVATED]

    CertificationLevel:
      type: string
      enum: [NONE, BRONZE, SILVER, GOLD]

    ContentStatus:
      type: string
      enum: [DRAFT, REVIEW, APPROVED, PUBLISHED, ARCHIVED]

    WineType:
      type: string
      enum: [red, white, rosé, sparkling, dessert, fortified]

    PriceTier:
      type: string
      enum: [budget, moderate, premium, luxury]

    Tier:
      type: string
      enum: [bronze, silver, gold]

    QuestionType:
      type: string
      enum: [multiple_choice, multiple_select, true_false, matching]

    Difficulty:
      type: string
      enum: [easy, medium, hard]

    ScenarioCategory:
      type: string
      enum: [WINE_PAIRING, CUSTOMER_SERVICE, UPSELLING, DIETARY_ALLERGIES, WINE_FAULTS, SPECIAL_OCCASIONS]

    ImportStatus:
      type: string
      enum: [UPLOADED, VALIDATING, VALIDATION_FAILED, AWAITING_CONFIRMATION, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED, CANCELLED]

    SubscriptionTier:
      type: string
      enum: [STARTER, PROFESSIONAL, ENTERPRISE]

    # ============ Common ============
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, timestamp]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
            requestId:
              type: string
            timestamp:
              type: string
              format: date-time

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer

    PaginationLinks:
      type: object
      properties:
        self:
          type: string
        first:
          type: string
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
        last:
          type: string

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # ============ Auth ============
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            tokenType:
              type: string
            user:
              $ref: '#/components/schemas/User'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            tokenType:
              type: string

    ResetPasswordRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    # ============ Users ============
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        jobTitle:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatus'
        certificationLevel:
          $ref: '#/components/schemas/CertificationLevel'
        avatarUrl:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'

    UserListResponse:
      type: object
      properties:
        data:
