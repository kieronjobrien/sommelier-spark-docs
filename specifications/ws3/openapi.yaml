            application/json:
              schema:
                $ref: '#/components/schemas/ExportReportResponse'

  # ============ Curriculum ============
  /curriculum/generate:
    post:
      tags: [Curriculum]
      summary: Generate curriculum
      description: Trigger curriculum generation from wine list.
      operationId: generateCurriculum
      requestBody:
        content:
