            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobResponse'

  /curriculum/status:
    get:
      tags: [Curriculum]
      summary: Get generation status
      description: Get curriculum generation status.
      operationId: getCurriculumStatus
      responses:
        '200':
          description: Generation status
